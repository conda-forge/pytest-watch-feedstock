schema_version: 1

context:
  version: 4.2.0

package:
  name: pytest-watch
  version: ${{ version }}

source:
- url: https://github.com/joeyespo/pytest-watch/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 6e6bbdf06c788635475a1f5b68acd818c2a239b7da87c0d263637fcbe6d86a45

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation
  python:
    entry_points:
      - pytest-watch = pytest_watch:main
      - ptw = pytest_watch:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - pytest >=2.6.4
    - docopt >=0.6.2
    - colorama >=0.3.3
    - watchdog >=0.6.0

tests:
  - python:
      imports:
        - pytest_watch
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
  - script:
      - ptw -V

about:
  license: MIT
  license_file: LICENSE
  summary: Local continuous test runner with pytest and watchdog.
  description: |
    pytest-watch a zero-config CLI tool that runs pytest, and re-runs it when
    a file in your project changes. It beeps on failures and can run arbitrary
    commands on each passing and failing test run.


  homepage: http://github.com/joeyespo/pytest-watch

extra:
  recipe-maintainers:
    - igortg
